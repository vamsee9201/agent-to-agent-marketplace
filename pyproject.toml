[project]
name = "agent-to-agent-marketplace"
version = "0.1.0"
description = "A2A Protocol demonstration with multi-framework vendor agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "a2a-sdk>=0.2.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-google-vertexai>=2.0.0",
    "langchain-core>=0.3.0",
    "crewai>=0.100.0",
    "mcp>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "google-cloud-aiplatform>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "concierge", "vendors"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
